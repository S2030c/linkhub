<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Übersicht</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Montserrat:wght@700;900&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & BASICS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Lato', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* GRID SYSTEM - 2 Spalten ab 800px und 3 Spalten ab 1200px */
        main {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 0;
            flex-grow: 1;
        }

        @media (min-width: 800px) { 
            main { grid-template-columns: repeat(2, 1fr); } 
        }
        @media (min-width: 1200px) { 
            main { grid-template-columns: repeat(3, 1fr); } 
        }

        /* PROJECT CARDS */
        .project-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: inset 0 0 0 0.5px #f1f5f9;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .tile-title {
            white-space: nowrap;
            display: inline-block;
            line-height: 1;
            padding: 0 10px;
            width: auto;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
            color: #1e293b;
        }

        /* TLD Styling für Kacheln und Modal-Titel */
        .tile-title .tld, #modal-title .tld {
            font-size: 0.6em;
            opacity: 0.8;
            margin-left: 2px;
        }

        .tile-icon {
            width: 110px;
            height: 110px;
            margin-bottom: 20px;
            opacity: 1; 
            filter: contrast(1.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .project-card:hover .tile-icon {
            opacity: 0.6; 
            transform: scale(1.1);
        }

        /* FOOTER */
        footer {
            padding: 5rem 0;
            text-align: center;
        }

        footer h4 {
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        footer div {
            color: #64748b;
            font-size: 0.875rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* MODAL */
        #modal {
            display: none;
            opacity: 0;
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: #ffffff;
            padding: 5vh 5vw;
            transition: opacity 0.4s ease;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        #modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 100%;
            max-width: 85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center center;
            will-change: transform;
        }

        #modal-accent-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 0.75rem;
            width: 100%;
        }

        #close-modal {
            position: fixed;
            top: 2rem;
            right: 2rem;
            color: #cbd5e1;
            padding: 0.5rem;
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.2s ease;
            z-index: 60;
        }

        #close-modal:hover { color: #0f172a; }

        #modal-icon {
            width: 160px;
            height: auto;
            max-height: 18vh;
            margin-bottom: 3vh;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            object-fit: contain;
        }

        #modal-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; /* Extra Fett für Mobilansicht */
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 3vh;
            padding: 0 1rem;
            width: auto;
            max-width: 100%;
            display: inline-block;
            /* Mobil-Standard: Einzeilig für fitText */
            white-space: nowrap;
            font-size: clamp(2rem, 10vh, 5rem);
        }

        @media (min-width: 800px) {
            #modal-title {
                /* Desktop: Erlaube Umbruch, aber mit moderaterer Maximalgröße */
                white-space: normal;
                word-break: keep-all;
                font-weight: 800; 
                font-size: clamp(2.5rem, 8vh, 4.5rem);
                width: 100%;
            }
        }

        #modal-text {
            font-weight: 400;
            color: #334155;
            max-width: 950px;
            line-height: 1.4;
            margin-bottom: 5vh;
            padding: 0 1.5rem;
            font-size: clamp(1.2rem, 3.8vh, 2.4rem);
        }

        #modal-link {
            display: inline-block;
            padding: 2.5vh 6vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: clamp(1.2rem, 3vh, 2rem);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #modal-link:hover { 
            transform: scale(1.05); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
        }
    </style>
</head>
<body class="min-h-screen">

    <main id="grid">
        <div class="project-card" data-name="Lebenswelten.com" data-color="#7C3AED" data-url="https://lebenswelten.com" data-description="Lebenswelten beschreiben die Gesamtheit der Erfahrungen, Beziehungen und Bedeutungen, in denen Menschen leben.">
            <img src="https://www.google.com/s2/favicons?domain=lebenswelten.com&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Lebenswelten<span class="tld">.com</span></h3>
        </div>

        <div class="project-card" data-name="DenkLabor.org" data-color="#DC2626" data-url="https://denklabor.org" data-description="Das DenkLabor ist ein interdisziplinärer Raum für die Transformation von Bewusstsein und Systemen. Bevor wir die Welt verändern, müssen wir unser Denken prüfen.">
            <img src="https://www.google.com/s2/favicons?domain=denklabor.org&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">DenkLabor<span class="tld">.org</span></h3>
        </div>

        <div class="project-card" data-name="Geisteswissen.de" data-color="#2563EB" data-url="https://geisteswissen.de" data-description="Geisteswissen.de versteht sich als eine Brücke zwischen normativer Welt und dem tiefen Bedürfnis nach innerer Sinnfindung.">
            <img src="https://www.google.com/s2/favicons?domain=geisteswissen.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Geisteswissen<span class="tld">.de</span></h3>
        </div>

        <div class="project-card" data-name="Gedankenwelten.com" data-color="#EA580C" data-url="https://gedankenwelten.com" data-description="Eine Plattform für reflektiertes Denken und bewusste Wahrnehmung. Sie zeigt auf, wie unterschiedlich Menschen ihre Wirklichkeit erleben.">
            <img src="https://www.google.com/s2/favicons?domain=gedankenwelten.com&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Gedankenwelten<span class="tld">.com</span></h3>
        </div>

        <div class="project-card" data-name="DigitalLabor.eu" data-color="#0891B2" data-url="https://digitallabor.eu" data-description="Ein Denkraum, in dem digitale Wirklichkeiten geprüft und neu geordnet werden. Philosophie und Gesellschaft treten hier in Dialog.">
            <img src="https://www.google.com/s2/favicons?domain=digitallabor.eu&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">DigitalLabor<span class="tld">.eu</span></h3>
        </div>

        <div class="project-card" data-name="Visionsuche.de" data-color="#16A34A" data-url="https://visionsuche.de" data-description="Ein intensiver, zeitlich begrenzter Rückzug in die Natur zur Findung innerer Klarheit. Ohne Ablenkung wird der Fokus auf das Wesentliche gelenkt.">
            <img src="https://www.google.com/s2/favicons?domain=visionsuche.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Visionsuche<span class="tld">.de</span></h3>
        </div>

        <div class="project-card" data-name="KunsTT.de" data-color="#EAB308" data-url="https://kunstt.de" data-description="Kunst entsteht dort, wo innerer Wirklichkeit Form findet und Erfahrung mit Bedeutung verbindet. Sie ist Ausdruck des Unaussprechlichen.">
            <img src="https://www.google.com/s2/favicons?domain=kunstt.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">KunsTT<span class="tld">.de</span></h3>
        </div>

        <div class="project-card" data-name="Freundschaft.org" data-color="#DB2777" data-url="https://freundschaft.org" data-description="Freundschaft ermöglicht authentische Selbstentfaltung durch Vertrauen und gegenseitige Anerkennung. Ein Raum für echtes Wachstum.">
            <img src="https://www.google.com/s2/favicons?domain=freundschaft.org&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Freundschaft<span class="tld">.org</span></h3>
        </div>

        <div class="project-card" data-name="SvenH.de" data-color="#4F46E5" data-url="https://svenh.de" data-description="Meine persönliche Website – ein strukturierter Überblick über meine Person, laufende Projekte und philosophische Themenkomplexe.">
            <img src="https://www.google.com/s2/favicons?domain=svenh.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">SvenH<span class="tld">.de</span></h3>
        </div>

        <div class="project-card" data-name="Svens.net" data-color="#65A30D" data-url="https://svens.net" data-description="Künstlerischer Freigeist als innere Haltung aus Eigenwahrnehmung und Mut. Eine Erforschung der Grenzen von Konvention.">
            <img src="https://www.google.com/s2/favicons?domain=svens.net&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Svens<span class="tld">.net</span></h3>
        </div>
    </main>

    <footer>
        <h4>Portfolio</h4>
        <div>2026 &mdash; Projekte von Sven</div>
    </footer>

    <div id="modal">
        <div id="modal-accent-bar"></div>
        <button id="close-modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="modal-content" id="modal-content">
            <img id="modal-icon" src="" alt="Icon">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <a id="modal-link" href="#" target="_blank">Website Besuchen</a>
        </div>
    </div>

    <script type="text/javascript">
        const cards = document.querySelectorAll('.project-card');
        const modal = document.getElementById('modal');
        const modalInner = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalLink = document.getElementById('modal-link');
        const modalAccent = document.getElementById('modal-accent-bar');
        const modalIcon = document.getElementById('modal-icon');
        const closeBtn = document.getElementById('close-modal');

        function fitText(element, container, baseSize = 2.5, paddingFactor = 0.88, minSize = 1.0) {
            let fontSize = baseSize; 
            element.style.fontSize = fontSize + 'rem';
            const maxAllowedWidth = container.offsetWidth * paddingFactor;

            while (element.scrollWidth > maxAllowedWidth && fontSize > minSize) {
                fontSize -= 0.1;
                element.style.fontSize = fontSize + 'rem';
            }
        }

        function scaleModalContent() {
            modalInner.style.transform = 'scale(1)';
            const availableHeight = window.innerHeight * 0.88; 
            const availableWidth = window.innerWidth * 0.92;
            const currentHeight = modalInner.offsetHeight;
            const currentWidth = modalInner.offsetWidth;

            const scaleH = availableHeight / currentHeight;
            const scaleW = availableWidth / currentWidth;
            let finalScale = Math.min(scaleH, scaleW, 1);
            modalInner.style.transform = `scale(${finalScale})`;
        }

        function openModal(card) {
            const data = card.dataset;
            const iconSrc = card.querySelector('.tile-icon').src;
            
            const nameParts = data.name.split('.');
            if (nameParts.length > 1) {
                modalTitle.innerHTML = `${nameParts[0]}<span class="tld">.${nameParts[1]}</span>`;
            } else {
                modalTitle.innerText = data.name;
            }

            modalText.innerText = data.description;
            modalLink.href = data.url;
            modalLink.style.backgroundColor = data.color;
            modalAccent.style.backgroundColor = data.color;
            modalIcon.src = iconSrc;
            
            modal.style.display = 'flex';
            
            setTimeout(() => {
                modal.classList.add('active');
                // Nur unter 800px aggressiv skalieren
                if (window.innerWidth < 800) {
                    fitText(modalTitle, modalInner, 5, 0.85, 0.8); 
                } else {
                    // Über 800px CSS clamp nutzen
                    modalTitle.style.fontSize = '';
                }
                scaleModalContent();
            }, 10);
            
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 400);
        }

        cards.forEach(card => {
            const color = card.dataset.color;
            const title = card.querySelector('.tile-title');

            card.addEventListener('mouseenter', () => {
                card.style.backgroundColor = color;
                title.style.color = 'white';
            });
            card.addEventListener('mouseleave', () => {
                card.style.backgroundColor = 'white';
                title.style.color = '#1e293b';
            });

            card.addEventListener('click', () => openModal(card));
            fitText(title, card, 2.0, 0.88, 0.6);
        });

        window.addEventListener('resize', () => {
            cards.forEach(card => {
                const title = card.querySelector('.tile-title');
                if (title) fitText(title, card, 2.0, 0.88, 0.6);
            });
            if (modal.classList.contains('active')) {
                if (window.innerWidth < 800) {
                    fitText(modalTitle, modalInner, 5, 0.85, 0.8);
                } else {
                    modalTitle.style.fontSize = '';
                }
                scaleModalContent();
            }
        });

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
