<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt Übersicht</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & BASICS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Lato', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* GRID SYSTEM */
        main {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 0;
            flex-grow: 1;
        }

        @media (min-width: 640px) { main { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { main { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { main { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1280px) { main { grid-template-columns: repeat(5, 1fr); } }

        /* PROJECT CARDS */
        .project-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: inset 0 0 0 0.5px #f1f5f9;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .tile-title {
            white-space: nowrap;
            display: inline-block;
            line-height: 1;
            padding: 0 10px;
            width: auto;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
            color: #1e293b;
        }

        .tile-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            opacity: 1; 
            filter: contrast(1.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .project-card:hover .tile-icon {
            opacity: 0.6; 
            transform: scale(1.1);
        }

        /* FOOTER */
        footer {
            padding: 6rem 0;
            text-align: center;
        }

        @media (min-width: 768px) { footer { padding: 8rem 0; } }

        footer h4 {
            color: #0f172a;
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) { footer h4 { font-size: 1.25rem; } }

        footer div {
            color: #64748b;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
        }

        @media (min-width: 768px) { footer div { font-size: 0.875rem; } }

        /* MODAL */
        #modal {
            display: none;
            opacity: 0;
            position: fixed;
            inset: 0;
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #ffffff;
            padding: 1.5rem;
            transition: opacity 0.4s ease;
            overflow-y: auto;
        }

        @media (min-width: 768px) { #modal { justify-content: center; } }

        #modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 100%;
            max-width: 80rem;
            padding-top: 6rem;
            padding-bottom: 3rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(1.02);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 768px) { .modal-content { padding-top: 0; padding-bottom: 0; } }

        #modal.active .modal-content {
            transform: scale(1);
        }

        #modal-accent-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 0.75rem;
            width: 100%;
        }

        #close-modal {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            color: #cbd5e1;
            padding: 0.5rem;
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.2s ease;
            z-index: 60;
        }

        #close-modal:hover {
            color: #0f172a;
        }

        #modal-icon {
            width: 128px;
            height: 128px;
            margin-bottom: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        #modal-title {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1.25;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
            width: 100%;
            font-size: 1.5rem;
        }

        @media (min-width: 640px) { #modal-title { font-size: 2.25rem; } }
        @media (min-width: 768px) { #modal-title { font-size: 3rem; margin-bottom: 2rem; } }
        @media (min-width: 1024px) { #modal-title { font-size: 3.75rem; } }

        #modal-text {
            font-weight: 400;
            color: #334155;
            max-width: 800px;
            line-height: 1.625;
            margin-bottom: 2.5rem;
            margin-left: auto;
            margin-right: auto;
            padding: 0 1rem;
            font-size: 1.125rem;
        }

        @media (min-width: 640px) { #modal-text { font-size: 1.25rem; } }
        @media (min-width: 768px) { #modal-text { font-size: 1.5rem; margin-bottom: 3.5rem; } }

        #modal-link {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-radius: 0.125rem;
            font-size: 0.875rem;
        }

        @media (min-width: 768px) { #modal-link { padding: 1.25rem 3rem; font-size: 1rem; } }

        #modal-link:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        #modal-link:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen">

    <main id="grid">
        <!-- Lebenswelten -->
        <div class="project-card"
             data-name="Lebenswelten.com"
             data-color="#7C3AED"
             data-url="https://lebenswelten.com"
             data-description="Lebenswelten beschreiben die Gesamtheit der Erfahrungen, Beziehungen und Bedeutungen, in denen Menschen leben. Sie strukturieren Wahrnehmung und Handeln.">
            <img src="https://www.google.com/s2/favicons?domain=lebenswelten.com&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Lebenswelten</h3>
        </div>

        <!-- DenkLabor -->
        <div class="project-card"
             data-name="DenkLabor.org"
             data-color="#DC2626"
             data-url="https://denklabor.org"
             data-description="Das DenkLabor ist ein interdisziplinärer Raum für die Transformation von Bewusstsein und Systemen. Bevor wir die Welt verändern können, müssen wir unsere Art zu denken verändern.">
            <img src="https://www.google.com/s2/favicons?domain=denklabor.org&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">DenkLabor</h3>
        </div>

        <!-- Geisteswissen -->
        <div class="project-card"
             data-name="Geisteswissen.de"
             data-color="#2563EB"
             data-url="https://geisteswissen.de"
             data-description="Geisteswissen.de versteht sich als eine Brücke, die zwischen der oft als starr empfundenen normativen Welt und dem tiefen Bedürfnis nach innerer Sinnfindung vermittelt.">
            <img src="https://www.google.com/s2/favicons?domain=geisteswissen.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Geisteswissen</h3>
        </div>

        <!-- Gedankenwelten -->
        <div class="project-card"
             data-name="Gedankenwelten.com"
             data-color="#EA580C"
             data-url="https://gedankenwelten.com"
             data-description="Eine Plattform für reflektiertes Denken und bewusste Wahrnehmung. Sie zeigt, wie unterschiedlich Menschen Wirklichkeit erleben – sachlich, persönlich, philosophisch.">
            <img src="https://www.google.com/s2/favicons?domain=gedankenwelten.com&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Gedankenwelten</h3>
        </div>

        <!-- DigitalLabor -->
        <div class="project-card"
             data-name="DigitalLabor.eu"
             data-color="#0891B2"
             data-url="https://digitallabor.eu"
             data-description="Ein Denkraum, in dem digitale Wirklichkeiten geprüft und neu geordnet werden. Philosophie, Technologie und Gesellschaft treten in Dialog.">
            <img src="https://www.google.com/s2/favicons?domain=digitallabor.eu&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">DigitalLabor</h3>
        </div>

        <!-- Visionsuche -->
        <div class="project-card"
             data-name="Visionsuche.de"
             data-color="#16A34A"
             data-url="https://visionsuche.de"
             data-description="Ein intensiver, zeitlich begrenzter Rückzug in die Natur, der dem Suchenden ermöglicht, Ablenkungen zu minimieren und innere Klarheit zu finden.">
            <img src="https://www.google.com/s2/favicons?domain=visionsuche.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Visionsuche</h3>
        </div>

        <!-- KunsTT -->
        <div class="project-card"
             data-name="KunsTT.de"
             data-color="#EAB308"
             data-url="https://kunstt.de"
             data-description="Kunst entsteht dort, wo innerer Wirklichkeit Form findet. Sie verbindet Erfahrung, Empfindung und Bedeutung, ohne sich erklären zu müssen.">
            <img src="https://www.google.com/s2/favicons?domain=kunstt.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">KunsTT</h3>
        </div>

        <!-- Freundschaft -->
        <div class="project-card"
             data-name="Freundschaft.org"
             data-color="#DB2777"
             data-url="https://freundschaft.org"
             data-description="Freundschaft ermöglicht authentische Selbstentfaltung in einem sozialen Raum durch gegenseitiges Vertrauen und freiwillige Anerkennung.">
            <img src="https://www.google.com/s2/favicons?domain=freundschaft.org&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Freundschaft</h3>
        </div>

        <!-- SvenH -->
        <div class="project-card"
             data-name="SvenH.de"
             data-color="#4F46E5"
             data-url="https://svenh.de"
             data-description="Meine persönliche Website – ein Überblick darüber, wer ich bin, was ich mache, womit ich mich beschäftige und welche Themen für mich wichtig sind.">
            <img src="https://www.google.com/s2/favicons?domain=svenh.de&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">SvenH</h3>
        </div>

        <!-- Svens -->
        <div class="project-card"
             data-name="Svens.net"
             data-color="#65A30D"
             data-url="https://svens.net"
             data-description="Künstlerischer Freigeist bezeichnet eine innere Haltung, die sich nicht an Konventionen bindet, sondern aus Eigenwahrnehmung und Mut schöpft.">
            <img src="https://www.google.com/s2/favicons?domain=svens.net&sz=128" class="tile-icon" alt="Icon">
            <h3 class="tile-title">Svens</h3>
        </div>
    </main>

    <footer>
        <h4>Portfolio</h4>
        <div>2026 &mdash; Projekte von Sven</div>
    </footer>

    <!-- Modal Struktur -->
    <div id="modal">
        <div id="modal-accent-bar"></div>
        
        <button id="close-modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div class="modal-content">
            <img id="modal-icon" src="" alt="Icon">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <a id="modal-link" href="#" target="_blank">Website Besuchen</a>
        </div>
    </div>

    <script type="text/javascript">
        const cards = document.querySelectorAll('.project-card');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalLink = document.getElementById('modal-link');
        const modalAccent = document.getElementById('modal-accent-bar');
        const modalIcon = document.getElementById('modal-icon');
        const closeBtn = document.getElementById('close-modal');

        /**
         * Passt die Schriftgröße an, um exakt in die Kachel zu passen (einzeilig).
         */
        function fitText(element, container) {
            let fontSize = 2.5; 
            element.style.fontSize = fontSize + 'rem';
            const maxAllowedWidth = container.offsetWidth * 0.82;

            while (element.scrollWidth > maxAllowedWidth && fontSize > 0.4) {
                fontSize -= 0.05;
                element.style.fontSize = fontSize + 'rem';
            }
        }

        /**
         * Öffnet das Modal mit den Daten aus den data-Attributen.
         */
        function openModal(card) {
            const data = card.dataset;
            const iconSrc = card.querySelector('.tile-icon').src;
            
            modalTitle.innerText = data.name;
            modalText.innerText = data.description;
            modalLink.href = data.url;
            modalLink.style.backgroundColor = data.color;
            modalAccent.style.backgroundColor = data.color;
            modalIcon.src = iconSrc;
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 400);
        }

        // Event-Listener und Initialisierung
        cards.forEach(card => {
            const color = card.dataset.color;
            const title = card.querySelector('.tile-title');

            card.addEventListener('mouseenter', () => {
                card.style.backgroundColor = color;
                card.style.boxShadow = 'none';
                title.style.color = 'white';
            });
            card.addEventListener('mouseleave', () => {
                card.style.backgroundColor = 'white';
                card.style.boxShadow = 'inset 0 0 0 0.5px #f1f5f9';
                title.style.color = '#1e293b';
            });

            card.addEventListener('click', () => openModal(card));

            // Initiales Text-Fitting
            fitText(title, card);
        });

        // Rekalkulation bei Fenstergrößenänderung
        window.addEventListener('resize', () => {
            cards.forEach(card => {
                const title = card.querySelector('.tile-title');
                if (title) fitText(title, card);
            });
        });

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
